<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skills You Cannot List · Instagram Post</title>
<!-- Brand guideline: ../../Design System (3).html (HackerEarth Design System v1) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Local brand fonts from the repo root (Google Fonts above is the fallback) */
  @font-face { font-family: 'Bricolage Grotesque'; src: url('../../BricolageGrotesque-VariableFont_opsz,wdth,wght.ttf') format('truetype'); font-weight: 200 800; }
  @font-face { font-family: 'Geist'; src: url('../../Geist-Regular.ttf') format('truetype'); font-weight: 400; }
  @font-face { font-family: 'Geist'; src: url('../../Geist-Medium.ttf') format('truetype'); font-weight: 500; }
  @font-face { font-family: 'Geist'; src: url('../../Geist-SemiBold.ttf') format('truetype'); font-weight: 600; }

  :root {
    --black: #020109;      /* brand black */
    --cta: #FF5722;
    --lime: #C7F252;
    --display: 'Bricolage Grotesque', 'Geist', sans-serif;
    --body: 'Geist', sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --pad: 88px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #E7E4DB; font-family: var(--body); -webkit-font-smoothing: antialiased; padding: 60px 0; }
  .deck { display: flex; flex-direction: column; align-items: center; gap: 60px; }
  body.export { padding: 0; background: transparent; }
  body.export .deck { gap: 0; }

  /* ===== Slide frame — Instagram portrait 4:5 ===== */
  .slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: var(--black); color: #fff; padding: 80px var(--pad) 88px; display: flex; flex-direction: column; }
  .slide > * { position: relative; z-index: 2; }

  /* ----- Slide 1 · Cover: photo + title only ----- */
  .photo { position: absolute; z-index: 0; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 68% 30%; }
  .wash { position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(180deg, rgba(2,1,9,0.15) 0%, rgba(2,1,9,0.25) 35%, rgba(2,1,9,0.85) 58%, var(--black) 72%);
  }
  h1 { margin-top: auto; font-family: var(--display); font-weight: 500; font-optical-sizing: auto; font-size: 104px; line-height: 0.98; letter-spacing: -3.2px; }
  h1 em { font-style: normal; color: var(--cta); }
  h1 .lead-in { display: block; color: rgba(255,255,255,0.72); font-size: 60px; line-height: 1.05; letter-spacing: -1.6px; margin-bottom: 24px; }

  /* ----- Slide 2 · Copy + CTA ----- */
  .copy { margin: auto 0; }
  .traits { display: flex; flex-direction: column; gap: 28px; }
  .trait { display: flex; align-items: baseline; gap: 26px; font-size: 50px; font-weight: 600; line-height: 1.12; letter-spacing: -1.1px; }
  .trait::before { content: ''; width: 16px; height: 16px; border-radius: 4px; background: var(--lime); flex-shrink: 0; transform: translateY(-8px); }
  .support { margin-top: 56px; font-size: 34px; line-height: 1.4; color: rgba(255,255,255,0.72); max-width: 860px; }

  .cta { padding-top: 44px; border-top: 1px dashed rgba(255,255,255,0.22); }
  .beyond { font-size: 40px; font-weight: 600; letter-spacing: -0.6px; }
  .btn-cta { margin-top: 32px; display: flex; align-items: center; justify-content: space-between; background: var(--cta); color: #fff; font-weight: 500; font-size: 34px; border-radius: 20px; padding: 30px 40px; }
  .btn-cta svg { width: 40px; height: 16px; }
  .with { margin-top: 28px; display: flex; align-items: center; gap: 16px; font-family: var(--mono); font-size: 18px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.6); }
  .with img { height: 36px; }

  /* Contour backdrop (DS signature motif, on-dark tokens) */
  .topo { position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: 0.42; }
  .topo svg { position: absolute; width: 1500px; height: 1100px; right: -640px; top: -260px; }
  .topo .contour { fill: none; stroke: rgba(255,255,255,0.18); stroke-width: 0.9; }
  .topo .contour.major { stroke: rgba(255,255,255,0.28); stroke-width: 1.1; }
  .topo .contour.peak { stroke: color-mix(in srgb, var(--lime) 55%, transparent); }
  .topo::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 65% 55% at 25% 50%, var(--black) 0%, var(--black) 35%, transparent 80%); }
</style>
</head>
<body>
<main class="deck">

  <!-- ================================================= SLIDE 1 · COVER -->
  <section class="slide s1" id="slide-1">
    <img class="photo" src="../../shutterstock_1799890306.jpg" alt="">
    <div class="wash" aria-hidden="true"></div>
    <h1><span class="lead-in">Your resume has a skills section.</span>But what about the skills you <em>cannot list?</em></h1>
  </section>

  <!-- ================================================= SLIDE 2 · COPY + CTA -->
  <section class="slide s2" id="slide-2">
    <div class="topo" aria-hidden="true">
      <svg viewBox="-100 -100 1100 800" preserveAspectRatio="xMidYMid meet">
        <path class="contour peak" d="M 380 280 Q 460 260 520 300 Q 540 360 480 390 Q 400 400 360 360 Q 340 310 380 280 Z"/>
        <path class="contour" d="M 330 220 Q 450 190 570 240 Q 610 310 560 390 Q 460 440 360 420 Q 280 360 300 280 Z"/>
        <path class="contour major" d="M 260 160 Q 440 120 620 180 Q 690 280 620 410 Q 460 480 290 450 Q 200 370 220 260 Z"/>
        <path class="contour" d="M 180 100 Q 420 60 670 120 Q 770 250 690 410 Q 480 520 250 480 Q 110 380 140 220 Z"/>
        <path class="contour" d="M 100 30 Q 390 0 730 70 Q 860 220 770 440 Q 510 580 200 520 Q 20 390 60 190 Z"/>
        <path class="contour major" opacity="0.55" d="M 0 -40 Q 360 -70 810 10 Q 970 190 870 480 Q 560 650 130 580 Q -80 430 -30 160 Z"/>
      </svg>
    </div>

    <div class="copy">
    <div class="traits">
      <span class="trait">How you think.</span>
      <span class="trait">How you approach challenges.</span>
      <span class="trait">How you respond to different situations.</span>
    </div>
    <p class="support">These qualities can matter just as much when understanding role fit.</p>
    </div>

    <div class="cta">
      <div class="beyond">Look beyond the obvious.</div>
      <div class="btn-cta">Explore psychometric assessments <svg viewBox="0 0 40 16"><path d="M0 8 H37 M30 1 L38 8 L30 15" fill="none" stroke="currentColor" stroke-width="2"/></svg></div>
      <div class="with">with <img src="../../Logo-Light.svg" alt="HackerEarth"></div>
    </div>
  </section>

</main>
<script>
  // ?export renders slides edge-to-edge for PNG capture
  if (new URLSearchParams(location.search).has('export')) document.body.classList.add('export');
</script>
</body>
</html>
