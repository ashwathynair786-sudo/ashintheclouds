<title>Compass Bloom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,600&family=Geist+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one full-bleed drafting sheet; the flower is constructed by compass in the middle, controls ride along the bottom edge. */
  :root {
    --paper: #e9ece4;
    --ink: #2b3330;
    --guide: rgba(43, 51, 48, 0.32);
    --petal-a: #d9486b;
    --petal-b: #ef8a5b;
    --petal-c: #f3c262;
    --seed: #5a3a2a;
    --chip: rgba(255, 255, 255, 0.55);
    --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #12201f; --ink: #dfe6dc; --guide: rgba(214, 228, 216, 0.28);
      --petal-a: #ff6f91; --petal-b: #ff9f6e; --petal-c: #ffd37a; --seed: #2a1a12;
      --chip: rgba(18, 32, 31, 0.6); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #12201f; --ink: #dfe6dc; --guide: rgba(214, 228, 216, 0.28);
    --petal-a: #ff6f91; --petal-b: #ff9f6e; --petal-c: #ffd37a; --seed: #2a1a12;
    --chip: rgba(18, 32, 31, 0.6); color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: var(--font-mono); overflow: hidden;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .head {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 20px);
    left: max(20px, env(safe-area-inset-left, 0px)); right: max(20px, env(safe-area-inset-right, 0px));
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap;
    pointer-events: none;
  }
  h1 {
    margin: 0; font-family: var(--font-display); font-weight: 300;
    font-size: clamp(26px, 4vw, 44px); letter-spacing: -0.02em; line-height: 1;
  }
  h1 b { font-weight: 600; }
  .readout { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.75; font-variant-numeric: tabular-nums; }
  .bar {
    position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; padding: 6px; border-radius: 999px;
    background: var(--chip); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--guide); max-width: calc(100% - 32px); flex-wrap: wrap; justify-content: center;
  }
  .bar button {
    font: 500 12px/1 var(--font-mono); letter-spacing: 0.04em; color: var(--ink);
    background: transparent; border: 0; border-radius: 999px; padding: 9px 13px; cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .bar button:hover { background: var(--guide); }
  .bar button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .bar button:focus-visible { outline: 2px solid var(--petal-a); outline-offset: 2px; }
  .sep { width: 1px; background: var(--guide); margin: 4px 2px; }
</style>

<canvas id="c" aria-label="Animated flower constructed from compass circles, polygons and a golden-angle seed spiral"></canvas>

<header class="head">
  <h1>Compass <b>Bloom</b></h1>
  <div class="readout" id="readout">n = 6 · seed of life</div>
</header>

<nav class="bar" aria-label="Animation controls">
  <button id="s5" data-n="5">5-fold</button>
  <button id="s6" data-n="6">6-fold</button>
  <button id="s8" data-n="8">8-fold</button>
  <button id="s12" data-n="12">12-fold</button>
  <span class="sep" aria-hidden="true"></span>
  <button id="cycle" aria-pressed="true">Auto cycle</button>
  <button id="pause">Pause</button>
</nav>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const readout = document.getElementById('readout');
  const pauseBtn = document.getElementById('pause');
  const cycleBtn = document.getElementById('cycle');
  const symBtns = [...document.querySelectorAll('[data-n]')];

  const GOLDEN = Math.PI * (3 - Math.sqrt(5)); // 137.508°
  const CYCLE = 15; // seconds per bloom
  const ORDER = [6, 5, 8, 12];
  const NAMES = { 5: 'pentagram rose', 6: 'seed of life', 8: 'octagram lotus', 12: 'dodecagon dahlia' };

  let W = 0, H = 0, dpr = 1, colors = {};
  let n = 6, t = 0, last = performance.now(), paused = false, auto = true;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function readColors() {
    const s = getComputedStyle(document.documentElement);
    for (const k of ['paper', 'ink', 'guide', 'petal-a', 'petal-b', 'petal-c', 'seed'])
      colors[k] = s.getPropertyValue('--' + k).trim();
  }
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const easeOut = x => 1 - Math.pow(1 - x, 3);
  const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const back = x => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

  function setN(v) {
    n = v; t = 0;
    readout.textContent = `n = ${n} · ${NAMES[n]} · 137.508°`;
    symBtns.forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.n === n)));
  }

  // Petal: a lens from the origin to (len, 0), widest at 45% of its length
  function petal(len, w) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(len * 0.25, w, len * 0.75, w * 0.9, len, 0);
    ctx.bezierCurveTo(len * 0.75, -w * 0.9, len * 0.25, -w, 0, 0);
    ctx.closePath();
  }

  function polygon(r, sides, step, rot) {
    ctx.beginPath();
    for (let i = 0; i <= sides; i++) {
      const a = rot + (i * step * 2 * Math.PI) / sides;
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
  }

  function draw() {
    const R = Math.min(W, H) * 0.24; // the compass radius
    const cx = W / 2, cy = H / 2 + Math.min(H * 0.02, 12);
    const fade = 1 - seg(t, CYCLE - 1.6, CYCLE - 0.2);
    const spin = t * 0.05;

    ctx.fillStyle = colors.paper;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.globalAlpha = fade;
    ctx.lineCap = 'round';

    // 1. Construction: centre circle, then n compass circles swung around it
    ctx.strokeStyle = colors.guide;
    ctx.lineWidth = 1;
    const c0 = easeInOut(seg(t, 0.2, 1.4));
    ctx.beginPath(); ctx.arc(0, 0, R, -Math.PI / 2, -Math.PI / 2 + c0 * 2 * Math.PI); ctx.stroke();
    for (let i = 0; i < n; i++) {
      const p = easeInOut(seg(t, 1.0 + i * 0.22, 2.0 + i * 0.22));
      if (!p) continue;
      const a = -Math.PI / 2 + (i * 2 * Math.PI) / n;
      const ox = Math.cos(a) * R, oy = Math.sin(a) * R;
      ctx.beginPath(); ctx.arc(ox, oy, R, a + Math.PI, a + Math.PI + p * 2 * Math.PI); ctx.stroke();
      // compass pivot
      ctx.fillStyle = colors.ink;
      ctx.globalAlpha = fade * (1 - seg(t, 2.6 + i * 0.22, 4));
      ctx.beginPath(); ctx.arc(ox, oy, 2.2, 0, 7); ctx.fill();
      ctx.globalAlpha = fade;
    }
    // outer boundary circle
    const c2 = easeInOut(seg(t, 2.4, 3.6));
    ctx.beginPath(); ctx.arc(0, 0, R * 2, -Math.PI / 2, -Math.PI / 2 + c2 * 2 * Math.PI); ctx.stroke();

    // 2. Straightedge: polygon and its star, counter-rotating
    ctx.save();
    ctx.rotate(-spin * 0.6);
    const pg = easeInOut(seg(t, 3.0, 4.4));
    if (pg) {
      ctx.strokeStyle = colors.ink;
      ctx.globalAlpha = fade * 0.55;
      ctx.lineWidth = 1.1;
      polygon(R * 2, n, 1, -Math.PI / 2);
      ctx.setLineDash([R * 2 * 2 * Math.PI * pg, 1e5]); ctx.stroke();
      const step = n === 6 ? 2 : n === 12 ? 5 : n === 8 ? 3 : 2;
      if (n === 6) { // hexagram = two triangles
        polygon(R * 2, 3, 1, -Math.PI / 2); ctx.stroke();
        polygon(R * 2, 3, 1, Math.PI / 2); ctx.stroke();
      } else {
        polygon(R * 2, n, step, -Math.PI / 2); ctx.stroke();
      }
      ctx.setLineDash([]);
      ctx.globalAlpha = fade;
    }
    ctx.restore();

    // 3. Bloom: three petal whorls, each scaled in with overshoot
    const layers = [
      { k: 2, len: 1.95, w: 0.42, col: colors['petal-a'], off: 0.5, a: 0.55, start: 4.2 },
      { k: 1, len: 1.55, w: 0.40, col: colors['petal-b'], off: 0, a: 0.75, start: 5.0 },
      { k: 1, len: 1.0, w: 0.34, col: colors['petal-c'], off: 0.5, a: 0.9, start: 5.8 },
    ];
    ctx.save();
    ctx.rotate(spin);
    for (const L of layers) {
      const count = n * L.k;
      for (let i = 0; i < count; i++) {
        const p = seg(t, L.start + i * (0.9 / count), L.start + 1.2 + i * (0.9 / count));
        if (!p) continue;
        const s = back(p);
        const breathe = 1 + 0.025 * Math.sin(t * 1.4 + i);
        ctx.save();
        ctx.rotate(-Math.PI / 2 + ((i + L.off) * 2 * Math.PI) / count);
        ctx.scale(s * breathe, s * breathe);
        petal(R * L.len, R * L.w * (L.k === 2 ? 0.7 : 1));
        ctx.globalAlpha = fade * L.a * clamp(p * 2);
        ctx.fillStyle = L.col; ctx.fill();
        ctx.globalAlpha = fade * 0.5 * clamp(p * 2);
        ctx.strokeStyle = colors.ink; ctx.lineWidth = 0.8 / Math.max(s, 0.2); ctx.stroke();
        // midrib
        ctx.beginPath(); ctx.moveTo(R * 0.12, 0); ctx.lineTo(R * L.len * 0.8, 0);
        ctx.globalAlpha = fade * 0.25 * clamp(p * 2); ctx.stroke();
        ctx.restore();
      }
    }
    ctx.restore();

    // 4. Seed head: golden-angle phyllotaxis (Vogel's model, r = c·√k)
    const discR = R * 0.42;
    const dp = easeOut(seg(t, 6.6, 7.4));
    if (dp) {
      ctx.globalAlpha = fade;
      ctx.fillStyle = colors['petal-c'];
      ctx.beginPath(); ctx.arc(0, 0, discR * dp, 0, 7); ctx.fill();
      const total = 240;
      const shown = Math.floor(total * easeOut(seg(t, 7.0, 10.2)));
      const c = discR / Math.sqrt(total) * 0.95;
      ctx.fillStyle = colors.seed;
      for (let k = 1; k <= shown; k++) {
        const a = k * GOLDEN + spin * 2;
        const r = c * Math.sqrt(k);
        const size = 0.6 + (r / discR) * 2.1;
        ctx.beginPath(); ctx.arc(Math.cos(a) * r, Math.sin(a) * r, size, 0, 7); ctx.fill();
      }
    }

    // 5. Dimension ticks on the outer circle, like a protractor
    const tk = seg(t, 8.0, 9.5);
    if (tk) {
      ctx.save(); ctx.rotate(-spin * 0.6);
      ctx.strokeStyle = colors.ink; ctx.lineWidth = 1;
      const ticks = n * 6;
      for (let i = 0; i < ticks * tk; i++) {
        const a = (i * 2 * Math.PI) / ticks - Math.PI / 2;
        const major = i % 6 === 0;
        const r0 = R * 2 + 6, r1 = r0 + (major ? 12 : 5);
        ctx.globalAlpha = fade * (major ? 0.7 : 0.35);
        ctx.beginPath(); ctx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); ctx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1); ctx.stroke();
      }
      ctx.restore();
    }
    ctx.restore();
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!paused) {
      t += dt;
      if (t >= CYCLE) {
        if (auto) setN(ORDER[(ORDER.indexOf(n) + 1) % ORDER.length]);
        else t = 0;
      }
    }
    draw();
    requestAnimationFrame(frame);
  }

  symBtns.forEach(b => b.addEventListener('click', () => {
    auto = false; cycleBtn.setAttribute('aria-pressed', 'false');
    setN(+b.dataset.n);
    if (paused) { paused = false; pauseBtn.textContent = 'Pause'; }
  }));
  cycleBtn.addEventListener('click', () => {
    auto = !auto; cycleBtn.setAttribute('aria-pressed', String(auto));
  });
  pauseBtn.addEventListener('click', () => {
    paused = !paused; pauseBtn.textContent = paused ? 'Play' : 'Pause';
  });

  addEventListener('resize', resize);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);
  new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  readColors(); resize(); setN(6);
  if (reduce) { t = 11; paused = true; pauseBtn.textContent = 'Play'; }
  else t = 0;
  requestAnimationFrame(frame);
})();
</script>
