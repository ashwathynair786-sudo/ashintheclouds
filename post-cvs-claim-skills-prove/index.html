<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CVs Claim, Skills Prove</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     HackerEarth static post — "CVs claim. Skills prove."
     Tokens from HackerEarth Design System v1 (marketing).
     Canvas: 1080 × 1350 (4:5).
     ============================================================ */
  :root {
    --bg: #FBF9F3;
    --bg-card: #FFFFFF;
    --bg-dark: #020109;
    --text: #020109;
    --text-muted: #545459;
    --border: rgba(2,1,9,0.10);
    --accent: #13255D;
    --cta: #FF5722;
    --lime: #C7F252;
    --eyebrow-on-dark: #A5A5AD;
    --state-success: #059669;
    --state-success-bg: #D1FAE5;

    --display: 'Bricolage Grotesque', 'Geist', sans-serif;
    --body: 'Geist', 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;

    --post-w: 1080px;
    --post-h: 1350px;
    --pad: 88px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #E9E6DD; }
  body { font-family: var(--body); -webkit-font-smoothing: antialiased; }
  em { font-style: normal; font-weight: inherit; color: var(--cta); }

  /* ---------- Preview shell (screen only) ---------- */
  .viewer { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; }
  .frame { width: calc(var(--post-w) * var(--s, 0.5)); height: calc(var(--post-h) * var(--s, 0.5)); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 2px rgba(2,1,9,0.06), 0 12px 32px rgba(2,1,9,0.10); }
  .frame > .post { transform: scale(var(--s, 0.5)); transform-origin: 0 0; }

  /* ---------- Export mode (?export) ---------- */
  html.export, html.export body { background: transparent; }
  html.export .viewer { display: block; padding: 0; min-height: 0; }
  html.export .frame { width: var(--post-w); height: var(--post-h); border-radius: 0; box-shadow: none; }
  html.export .frame > .post { transform: none; }

  /* ---------- Post ---------- */
  .post { position: relative; width: var(--post-w); height: var(--post-h); overflow: hidden; background: var(--bg-dark); color: #fff; padding: var(--pad); display: flex; flex-direction: column; }

  .chrome-top { position: relative; z-index: 3; display: flex; justify-content: space-between; align-items: center; height: 40px; }
  .chrome-top .logo { height: 34px; display: block; }
  .compass { width: 40px; height: 40px; display: block; }
  .compass svg { width: 100%; height: 100%; display: block; }
  .compass .c-ring { fill: none; stroke: rgba(255,255,255,0.42); stroke-width: 0.7; }
  .compass .c-tick { stroke: rgba(255,255,255,0.55); stroke-width: 0.9; }
  .compass .c-n { stroke: var(--lime); stroke-width: 1.2; }
  .compass .c-dot { fill: var(--lime); }

  /* Contours — on-dark tokens, masked toward the headline */
  .topo { position: absolute; z-index: 1; pointer-events: none; width: 1700px; height: 1400px; right: -780px; top: -420px; opacity: 0.42;
    -webkit-mask-image: radial-gradient(ellipse 55% 55% at 55% 50%, #000 30%, transparent 75%);
            mask-image: radial-gradient(ellipse 55% 55% at 55% 50%, #000 30%, transparent 75%); }
  .topo svg { width: 100%; height: 100%; display: block; }
  .topo .contour { fill: none; stroke-width: 0.9; stroke: rgba(255,255,255,0.18); }
  .topo .contour.major { stroke: rgba(255,255,255,0.28); stroke-width: 1.1; }
  .topo .contour.peak { stroke: color-mix(in srgb, var(--lime) 55%, transparent); }

  .body { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; padding-top: 104px; }
  .h1 { font-family: var(--display); font-weight: 500; font-variation-settings: 'opsz' 96; font-size: 168px; line-height: 0.94; letter-spacing: -5px; }

  /* ---------- Claim vs proof ---------- */
  .compare { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .card { border-radius: 24px; padding: 30px 32px 28px; display: flex; flex-direction: column; }
  .card-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; margin-bottom: 4px; }
  .card-label { font-family: var(--mono); font-size: 18px; font-weight: 500; text-transform: uppercase; letter-spacing: 2px; }
  .card-idx { font-family: var(--mono); font-size: 16px; letter-spacing: 1.4px; }
  .row { padding: 20px 0; border-top: 1px dashed; }
  .row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; }
  .skill { font-family: var(--body); font-size: 26px; font-weight: 500; letter-spacing: -0.2px; }
  .meter { height: 10px; border-radius: 100px; position: relative; overflow: hidden; }
  .meter span { position: absolute; inset: 0 auto 0 0; border-radius: 100px; }

  /* Claim card: translucent, dashed — unverified */
  .card.claim { background: rgba(255,255,255,0.03); border: 2px dashed rgba(255,255,255,0.18); }
  .claim .card-label { color: var(--eyebrow-on-dark); }
  .claim .card-idx { color: rgba(255,255,255,0.35); }
  .claim .row { border-top-color: rgba(255,255,255,0.12); }
  .claim .skill { color: rgba(255,255,255,0.72); }
  .claim .said { font-family: var(--mono); font-size: 16px; text-transform: uppercase; letter-spacing: 1.4px; color: rgba(255,255,255,0.45); }
  .claim .meter { background: repeating-linear-gradient(90deg, rgba(255,255,255,0.22) 0 10px, transparent 10px 18px); }

  /* Proof card: solid white — verified */
  .card.proof { background: var(--bg-card); color: var(--text); border: 1px solid rgba(255,255,255,0.08); }
  .proof .card-label { color: var(--accent); }
  .proof .card-idx { color: var(--text-muted); }
  .proof .row { border-top-color: var(--border); }
  .proof .score { font-family: var(--display); font-weight: 500; font-size: 34px; letter-spacing: -0.8px; line-height: 1; color: var(--text); }
  .proof .score .u { font-size: 0.55em; color: var(--text-muted); font-weight: 400; letter-spacing: 0; margin-left: 2px; }
  .proof .meter { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .proof .meter span { background: var(--accent); }
  .verified { display: inline-flex; align-items: center; gap: 10px; align-self: flex-start; margin-top: 8px; font-family: var(--mono); font-size: 16px; font-weight: 500; text-transform: uppercase; letter-spacing: 1.5px; padding: 9px 18px; border-radius: 100px; background: var(--state-success-bg); color: var(--state-success); }
  .verified::before { content: ''; width: 15px; height: 8px; border-left: 3px solid currentColor; border-bottom: 3px solid currentColor; transform: rotate(-45deg) translate(2px, -2px); }
  .claim-foot { margin-top: 8px; align-self: flex-start; font-family: var(--mono); font-size: 16px; font-weight: 500; text-transform: uppercase; letter-spacing: 1.5px; padding: 8px 18px; border-radius: 100px; border: 1px dashed rgba(255,255,255,0.3); color: var(--eyebrow-on-dark); }
</style>
</head>
<body>

<div class="viewer">
  <div class="frame"><section class="post">
    <div class="topo" aria-hidden="true">
      <svg viewBox="-60 -120 1000 860" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <path class="contour peak" d="M 380 280 Q 460 260 520 300 Q 540 360 480 390 Q 400 400 360 360 Q 340 310 380 280 Z"/>
        <path class="contour" d="M 330 220 Q 450 190 570 240 Q 610 310 560 390 Q 460 440 360 420 Q 280 360 300 280 Z"/>
        <path class="contour major" d="M 260 160 Q 440 120 620 180 Q 690 280 620 410 Q 460 480 290 450 Q 200 370 220 260 Z"/>
        <path class="contour" d="M 180 100 Q 420 60 670 120 Q 770 250 690 410 Q 480 520 250 480 Q 110 380 140 220 Z"/>
        <path class="contour" d="M 100 30 Q 390 0 730 70 Q 860 220 770 440 Q 510 580 200 520 Q 20 390 60 190 Z"/>
        <path class="contour major" d="M 0 -40 Q 360 -70 810 10 Q 970 190 870 480 Q 560 650 130 580 Q -80 430 -30 160 Z"/>
        <path class="contour" opacity="0.7" d="M -60 -110 Q 340 -150 880 -50 Q 1060 170 950 530 Q 600 730 60 650 Q -170 470 -110 130 Z"/>
      </svg>
    </div>

    <header class="chrome-top">
      <img class="logo" src="../Logo-Light.svg" alt="HackerEarth">
      <span class="compass" aria-hidden="true"><svg viewBox="0 0 22 22">
        <circle cx="11" cy="11" r="9" class="c-ring"/>
        <circle cx="11" cy="11" r="5" class="c-ring"/>
        <line x1="11" y1="2" x2="11" y2="6" class="c-n"/>
        <line x1="20" y1="11" x2="16" y2="11" class="c-tick"/>
        <line x1="11" y1="20" x2="11" y2="16" class="c-tick"/>
        <line x1="2" y1="11" x2="6" y2="11" class="c-tick"/>
        <circle cx="11" cy="11" r="1.2" class="c-dot"/>
      </svg></span>
    </header>

    <div class="body">
      <h1 class="h1">CVs claim.<br><em>Skills prove.</em></h1>

      <div class="compare">
        <div class="card claim">
          <div class="card-head"><span class="card-label">The CV</span><span class="card-idx">01</span></div>
          <div class="row"><div class="row-top"><span class="skill">Python</span><span class="said">Expert</span></div><div class="meter"></div></div>
          <div class="row"><div class="row-top"><span class="skill">SQL</span><span class="said">Advanced</span></div><div class="meter"></div></div>
          <div class="row"><div class="row-top"><span class="skill">System design</span><span class="said">Strong</span></div><div class="meter"></div></div>
          <span class="claim-foot">Self-reported</span>
        </div>
        <div class="card proof">
          <div class="card-head"><span class="card-label">The skills</span><span class="card-idx">02</span></div>
          <div class="row"><div class="row-top"><span class="skill">Python</span><span class="score">92<span class="u">/100</span></span></div><div class="meter"><span style="width: 92%"></span></div></div>
          <div class="row"><div class="row-top"><span class="skill">SQL</span><span class="score">78<span class="u">/100</span></span></div><div class="meter"><span style="width: 78%"></span></div></div>
          <div class="row"><div class="row-top"><span class="skill">System design</span><span class="score">64<span class="u">/100</span></span></div><div class="meter"><span style="width: 64%"></span></div></div>
          <span class="verified">Verified</span>
        </div>
      </div>
    </div>
  </section></div>
</div>

<script>
  if (new URLSearchParams(location.search).has('export')) document.documentElement.classList.add('export');
  function fit() {
    if (document.documentElement.classList.contains('export')) return;
    const s = Math.min((innerHeight - 64) / 1350, (innerWidth - 32) / 1080, 0.7);
    document.documentElement.style.setProperty('--s', Math.max(0.2, s).toFixed(3));
  }
  addEventListener('resize', fit);
  fit();
</script>
</body>
</html>
