  const u=t/T, th=TAU*u, breath=1+0.018*Math.sin(th), fade=eInOut(cl(t/1.2));
  D.pts.forEach((a,i)=>{
    let s='';
    for(let j=0;j<a.length;j+=2){
      let x=SX+(a[j]-SX)*breath, y=SY+(a[j+1]-SY)*breath;
      x+=A*(Math.sin(x*k1+y*k2*.6+th)+.5*Math.sin(x*k3-y*k1+2*th+1.3));
      y+=A*(Math.cos(y*k1-x*k2*.5+th+.7)+.5*Math.cos(y*k3+x*k2-2*th+2.1));
      s+=(j?'L':'M')+x.toFixed(2)+','+y.toFixed(2);
    }
    els[i].setAttribute('d',s);
    const w=.5+.5*Math.cos(TAU*(D.rank[i]*1.3-u*2));
    els[i].style.strokeOpacity=(fade*(.22+.46*Math.pow(w,2.5))).toFixed(3);
  });
  // container: scale in with overshoot
  const cs=eOutBack(cl((t-0.5)/0.9)), rot=-10*(1-eOutExpo(cl((t-0.5)/1.1)));
  markin.setAttribute('transform',`translate(15 15) rotate(${rot.toFixed(2)}) scale(${Math.max(0,cs).toFixed(4)}) translate(-15 -15)`);
  // h drops in from above
  const hy=-34*(1-eOutBack(cl((t-1.05)/0.75),1.4));
  hg.setAttribute('transform',`translate(0 ${hy.toFixed(3)})`);
  // cursor draws in, then blinks
  const cw=eOutExpo(cl((t-1.75)/0.35)); let co=cw>0?1:0;
  if(t>3.9&&t<6.3) co=(Math.floor((t-3.9)/0.4)%2===0)?0:1;
  cur.setAttribute('width',(12.8*cw).toFixed(3)); cur.setAttribute('opacity',co);
  // mark glides left as the wordmark arrives
  const sl=65*(1-eInOut(cl((t-1.9)/1.1)));
  slide.setAttribute('transform',`translate(${sl.toFixed(3)} 0)`);
  lets.forEach((p,i)=>{
    const k=eOutExpo(cl((t-2.15-i*0.075)/0.9));
    p.setAttribute('transform',`translate(${(4*(1-k)).toFixed(3)} ${(7*(1-k)).toFixed(3)})`);
    p.style.opacity=k.toFixed(3); p.style.filter=k<1?`blur(${(1.2*(1-k)).toFixed(3)}px)`:'none';
  });
};
setTime(0);
</script></body></html>
